<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizontal Balancing Machine</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #222; }
    .banner {
      width: 100%;
      min-height: 320px;
      height: min(70vh, 620px);
      background: #222 url("04_Balancing_Machine_Picture.png.jpg") top center / cover no-repeat;
      position: relative;
    }
    .banner h1 {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 18px 26px;
      color: #fff;
      background: #0969da;
      font-size: clamp(1.7rem, 4vw, 3rem);
      line-height: 1.15;
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0,0,0,.25);
      max-width: 100%;
    }
    @media (max-width: 480px) {
      .banner { height: 55vh; }
      .banner h1 { padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <header class="banner" role="img" aria-label="Horizontal balancing machine">
    <h1>Horizontal Balancing Machine</h1>
  </header>
</body>
</html>
